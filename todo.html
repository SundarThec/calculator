
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 40px 16px;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #f3f7f4;
    }

    .page {
      width: min(100%, 640px);
      margin: 0 auto;
    }

    .page-header {
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #568469;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.14em;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.04em;
    }

    h1 span {
      color: #4e9b70;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #6b7280;
    }

    .todo-card {
      padding: 24px;
      border: 1px solid #e3eae5;
      border-radius: 22px;
      background: #fff;
      box-shadow: 0 16px 40px #2546320d;
    }

    .add-form {
      display: flex;
      gap: 10px;
    }

    .add-form input {
      min-width: 0;
      flex: 1;
      padding: 13px 15px;
      border: 1px solid #dce4de;
      border-radius: 12px;
      font: inherit;
      outline: none;
    }

    .add-form input:focus {
      border-color: #4e9b70;
      box-shadow: 0 0 0 3px #4e9b7020;
    }

    button {
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .add-button {
      padding: 0 20px;
      border-radius: 12px;
      color: #fff;
      background: #397a55;
      font-weight: 600;
    }

    .add-button:hover {
      background: #2e6747;
    }

    .task-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 26px 0 14px;
    }

    .task-count {
      margin: 0;
      color: #6b7280;
      font-size: 0.9rem;
    }

    .filters {
      display: flex;
      gap: 5px;
      padding: 4px;
      border-radius: 11px;
      background: #f2f5f3;
    }

    .filter-button {
      padding: 7px 11px;
      border-radius: 8px;
      color: #66736a;
      background: transparent;
      font-size: 0.85rem;
    }

    .filter-button[aria-pressed="true"] {
      color: #2e6747;
      background: #fff;
      box-shadow: 0 1px 3px #00000012;
    }

    .task-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 12px;
      border: 1px solid #edf0ee;
      border-radius: 12px;
    }

    .task-label {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      flex: 1;
      cursor: pointer;
    }

    .task-checkbox {
      width: 19px;
      height: 19px;
      flex: 0 0 auto;
      accent-color: #397a55;
      cursor: pointer;
    }

    .task-text {
      overflow-wrap: anywhere;
    }

    .task-item.completed .task-text {
      color: #9aa39d;
      text-decoration: line-through;
    }

    .delete-button {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      border-radius: 9px;
      color: #8b9690;
      background: transparent;
      font-size: 1.3rem;
    }

    .delete-button:hover {
      color: #b42318;
      background: #fff0ee;
    }

    .empty-state {
      padding: 28px 12px;
      border: 1px dashed #dce4de;
      border-radius: 12px;
      color: #77817a;
      text-align: center;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid #edf0ee;
    }

    .card-footer span {
      color: #8a948d;
      font-size: 0.8rem;
    }

    .clear-button {
      padding: 6px 0;
      color: #66736a;
      background: transparent;
      font-size: 0.85rem;
    }

    .clear-button:hover:not(:disabled) {
      color: #b42318;
    }

    .clear-button:disabled {
      cursor: not-allowed;
      opacity: 0.45;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 480px) {
      body {
        padding-top: 28px;
      }

      .todo-card {
        padding: 18px;
      }

      .task-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">A LITTLE MORE ORGANIZED</p>
      <h1>My to-do list<span>.</span></h1>
      <p class="subtitle">Add a task, check it off, and keep moving.</p>
    </header>

    <section class="todo-card" aria-label="To-do list">
      <form class="add-form" id="add-form">
        <label class="sr-only" for="task-input">New task</label>
        <input
          id="task-input"
          type="text"
          placeholder="What needs to get done?"
          maxlength="160"
          autocomplete="off"
          required
        >
        <button class="add-button" type="submit">Add task</button>
      </form>

      <div class="task-toolbar">
        <p class="task-count" id="task-count" aria-live="polite"></p>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter-button" type="button" data-filter="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">Active</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">Completed</button>
        </div>
      </div>

      <ul class="task-list" id="task-list" aria-label="Tasks"></ul>

      <footer class="card-footer">
        <button class="clear-button" id="clear-completed" type="button">
          Clear completed
        </button>
        <span>Your tasks are saved in this browser.</span>
      </footer>
    </section>
  </main>

  <script>
    const STORAGE_KEY = "simple-todo-list";
    const addForm = document.getElementById("add-form");
    const taskInput = document.getElementById("task-input");
    const taskList = document.getElementById("task-list");
    const taskCount = document.getElementById("task-count");
    const clearCompletedButton = document.getElementById("clear-completed");

    let tasks = loadTasks();
    let currentFilter = "all";

    function loadTasks() {
      try {
        const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(savedTasks) ? savedTasks : [];
      } catch {
        return [];
      }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function createId() {
      return window.crypto?.randomUUID
        ? window.crypto.randomUUID()
        : `${Date.now()}-${Math.random()}`;
    }

    function renderTasks() {
      taskList.replaceChildren();

      const remaining = tasks.filter(task => !task.completed).length;
      taskCount.textContent =
        remaining === 1 ? "1 task left" : `${remaining} tasks left`;

      clearCompletedButton.disabled = !tasks.some(task => task.completed);

      document.querySelectorAll("[data-filter]").forEach(button => {
        button.setAttribute(
          "aria-pressed",
          String(button.dataset.filter === currentFilter)
        );
      });

      const visibleTasks = tasks.filter(task => {
        if (currentFilter === "active") return !task.completed;
        if (currentFilter === "completed") return task.completed;
        return true;
      });

      if (visibleTasks.length === 0) {
        const emptyMessage = document.createElement("li");
        emptyMessage.className = "empty-state";

        if (tasks.length === 0) {
          emptyMessage.textContent = "No tasks yet. Add one above to get started.";
        } else if (currentFilter === "active") {
          emptyMessage.textContent = "All done! No active tasks.";
        } else if (currentFilter === "completed") {
          emptyMessage.textContent = "No completed tasks yet.";
        } else {
          emptyMessage.textContent = "No tasks to show.";
        }

        taskList.append(emptyMessage);
        return;
      }

      visibleTasks.forEach(task => {
        const item = document.createElement("li");
        item.className = `task-item${task.completed ? " completed" : ""}`;
        item.dataset.id = task.id;

        const label = document.createElement("label");
        label.className = "task-label";

        const checkbox = document.createElement("input");
        checkbox.className = "task-checkbox";
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;

        const text = document.createElement("span");
        text.className = "task-text";
        text.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-button";
        deleteButton.type = "button";
        deleteButton.textContent = "×";
        deleteButton.setAttribute("aria-label", `Delete ${task.text}`);

        label.append(checkbox, text);
        item.append(label, deleteButton);
        taskList.append(item);
      });
    }

    addForm.addEventListener("submit", event => {
      event.preventDefault();

      const text = taskInput.value.trim();
      if (!text) {
        taskInput.focus();
        return;
      }

      tasks.unshift({
        id: createId(),
        text,
        completed: false
      });

      currentFilter = "all";
      saveTasks();
      renderTasks();
      addForm.reset();
      taskInput.focus();
    });

    taskList.addEventListener("change", event => {
      if (!event.target.matches(".task-checkbox")) return;

      const item = event.target.closest(".task-item");
      const task = tasks.find(task => task.id === item.dataset.id);

      if (task) {
        task.completed = event.target.checked;
        saveTasks();
        renderTasks();
      }
    });

    taskList.addEventListener("click", event => {
      const button = event.target.closest(".delete-button");
      if (!button) return;

      const item = button.closest(".task-item");
      tasks = tasks.filter(task => task.id !== item.dataset.id);

      saveTasks();
      renderTasks();
    });

    document.querySelector(".filters").addEventListener("click", event => {
      const button = event.target.closest("[data-filter]");
      if (!button) return;

      currentFilter = button.dataset.filter;
      renderTasks();
    });

    clearCompletedButton.addEventListener("click", () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      renderTasks();
    });

    renderTasks();
  </script>
</body>
</html>
